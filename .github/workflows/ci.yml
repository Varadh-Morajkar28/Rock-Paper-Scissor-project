name: Build and Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-assets
          path: .
